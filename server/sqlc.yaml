version: "2"

sql:
  - engine: "postgresql"
    schema: &schema "migrations"
    queries: "internal/modules/iam/db"

    gen:
      go: &go_opts
        out: "internal/modules/iam/db/sqlc"
        sql_package: "pgx/v5"

        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true

        overrides: &overrides
          - db_type: "uuid"
            go_type: &uuid_type
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "timestamptz"
            go_type: &time_type
              import: "time"
              type: "Time"
